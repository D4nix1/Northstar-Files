name: Bug report
description: Report an issue with the experimental Windows build
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Northstar Files is experimental. Do not include personal files, private paths, or sensitive logs."
  - type: input
    id: version
    attributes:
      label: Northstar Files version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions or other context
